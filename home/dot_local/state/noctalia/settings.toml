config_version = 15

[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    capsule = true
    center = [ "widget_2", "clock", "control-center", "widget", "orb", "bar" ]
    end = [ "tray", "sysmon", "battery", "network", "notifications" ]
    margin_ends = 0
    show_on_workspace_switch = false
    start = [ "workspaces", "media", "lyrics" ]
    thickness = 40

[battery]
warning_threshold = 25

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.99999997764825821
concave_edge_corners = false
cross_axis_padding = 0
enabled = true
icon_size = 50
item_spacing = 0
main_axis_padding = 0
margin_edge = 10
pinned = [
    "firefox",
    "org.gnome.Evince",
    "org.kde.dolphin",
    "ghidra",
    "org.telegram.desktop",
    "org.wireshark.Wireshark",
    "com.github.neithern.g4music",
    "org.gnome.TextEditor",
    "burpsuite-pro",
    "vesktop",
    "Alacritty",
    "hermes-desktop"
]
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 160.0
    box_width = 352.0
    cx = 960.0
    cy = 476.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 0.88

[plugin_settings."ahmedhossamdev/sticky-notes"]
no_colors = true

[plugin_settings."shadow/habits"]
panel_open_near_click = true
panel_placement = "attached"

    [plugin_settings."shadow/habits".habits]
    AI = "sparkles | opencode, oc |, claude, claude code, kiro, gemini, codex, aider, crush, cursor-agent, copilot, qwen, ollama, chatgpt, perplexity"
    Crypto = "key | hashcat, john, hashid, hash-identifier, ares"
    Forensics = "fingerprint | pdf-parser, peepdf"
    Network = "network | wireshark, tshark, tcpdump, dig, nslookup"
    Reading = "book | zathura, okular, evince, papers, foliate, .pdf, .epub, .djvu"
    "Reverse Engineering" = "cpu | gdb, pwndbg, radare2, r2, cutter, ghidra, ida, ida64, ghex, imhex, edb, pwn, binsider, binwalk, ltrace, strace"
    Steganography = "photo-search | steghide, stegseek, exiftool, sonic visualiser, sonicvisualiser, foremost"
    "Web Security" = "bug | burpsuite, burp suite, caido, ffuf, sqlmap, nmap, nc, ncat, netcat, msfconsole, metasploit, theharvester, feroxbuster, httprobe, waybackurls, amass, 403jump, dirsearch, arjun, findomain, assetfinder, sublist3r, subbrute, aquatone, gowitness, subcat, waymore, gf, subjack, nuclei, httpx, subfinder, gau, dalfox, trufflehog, curl"

[plugin_settings."shadow/orb"]
eye_color = "surface_variant"
outline_color = "on_surface_variant"

[plugins]
enabled = [
    "noctalia/translator",
    "noctalia/screen_recorder",
    "shadow/lyrics",
    "ahmedhossamdev/sticky-notes",
    "shadowe1ite/claude-fm",
    "shadow/orb"
]

[shell]
clipboard_image_action_command = "satty -f -"
font_family = "SauceCodePro Nerd Font Mono"
niri_overview_type_to_launch_enabled = true
panel_anchor_bar = "default"
polkit_agent = true
screen_time_enabled = true

    [shell.panel]
    open_near_click_control_center = true

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    confirm_region = true
    directory = "/home/shadow/Videos/Recordings"
    remember_last_region = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 15.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty" ]
    community_ids = [ "opencode" ]

[wallpaper]
directory = "/home/shadow/Pictures/Wallpapers/fav"

    [wallpaper.default]
    path = "/home/shadow/Pictures/Wallpapers/fav/Green/07. Rain Dark.jpg"

    [wallpaper.last]
    path = "/home/shadow/Pictures/Wallpapers/fav/Green/07. Rain Dark.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/shadow/Pictures/Wallpapers/fav/Green/07. Rain Dark.jpg"

[widget.bar]
type = "ahmedhossamdev/sticky-notes:bar"

[widget.clock]
font_family = "SauceCodePro Nerd Font Propo"
format = "{:%-I:%M %P  %d.%m.%Y}"
tooltip_format = "{:%H:%M %a, %b %d}"
vertical_format = "{:%H %M - %d %m}"

[widget.control-center]
glyph = "brand-redhat"

[widget.lyrics]
max_length = 25
scroll = "always"
type = "shadow/lyrics:lyrics"
when_paused = "hide"

[widget.media]
capsule = true
max_length = 150
title_scroll = "on_hover"

[widget.orb]
type = "shadow/orb:orb"

[widget.session]
capsule = true

[widget.sysmon]
font_family = "JetBrainsMono Nerd Font Mono"
stat = "cpu_temp"

[widget.tray]
capsule = true

[widget.widget]
type = "shadow/habits:widget"

[widget.widget_2]
type = "shadowe1ite/claude-fm:widget"

[widget.workspaces]
show_labels = false