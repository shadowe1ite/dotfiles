[colors.primary]
foreground = "#d5c4a1"
background = "{{colors.surface.default.hex}}"

[colors.normal]
black   = "#3c3836"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#d5c4a1"

[colors.bright]
black   = "#484442"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#fbf1c7"

[colors.footer_bar]
background = '{{colors.surface.default.hex}}'
foreground = '{{colors.on_primary_container.default.hex}}'

[colors.selection]
text       = "{{colors.inverse_on_surface.default.hex}}"
background = "{{colors.inverse_surface.default.hex}}"

[colors.cursor]
text   = "{{colors.inverse_primary.default.hex}}"
cursor = "{{colors.primary.default.hex}}"

[colors.search.matches]
foreground = "{{colors.on_primary_container.default.hex}}"
background = "{{colors.primary_container.default.hex}}"

[colors.search.focused_match]
foreground = "{{colors.inverse_primary.default.hex}}"
background = "{{colors.on_primary_container.default.hex}}"

[colors.hints.start]
foreground = "{{colors.on_secondary_container.default.hex}}"
background = "{{colors.secondary_container.default.hex}}"

[colors.hints.end]
foreground = "{{colors.on_secondary_container.default.hex}}"
background = "{{colors.secondary_container.default.hex}}"
