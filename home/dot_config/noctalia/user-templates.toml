# noctalia 5.x: user templates live under [theme.templates.user.<id>].
# The old top-level [templates.<id>] tables from 4.x parse as an unknown
# section and are silently dropped ("templates: unknown section" in the log).
# Valid keys per entry: input_path, output_path (string or array),
# output_path_dynamic, post_hook, hook_async, colors_to_compare, compare_to.
# input_path_dynamic and undo_hook are built-in-catalog only.

[theme.templates.user.tmux]
input_path = '~/.config/matugen/templates/colors-tmux.conf'
output_path = '~/.config/tmux/tmux.conf'
post_hook = 'tmux source ~/.config/tmux/tmux.conf &'

[theme.templates.user.starship]
input_path = '~/.config/matugen/templates/colors-starship.toml'
output_path = '~/.config/starship.toml'

[theme.templates.user.alacritty]
input_path = '~/.config/matugen/templates/terminals/colors-alacritty.toml'
output_path = '~/.config/alacritty/material.toml'

[theme.templates.user.ghostty]
input_path = '~/.config/matugen/templates/terminals/colors-ghostty'
output_path = '~/.config/ghostty/themes/material'

[theme.templates.user.qt5ct]
input_path = '~/.config/matugen/templates/colors-qt.conf'
output_path = '~/.config/qt5ct/colors/meterial.conf'

[theme.templates.user.gtk3]
input_path = '~/.config/matugen/templates/noctalia-templates/gtk/gtk3.css'
output_path = '~/.config/gtk-3.0/noctalia.css'

[theme.templates.user.gtk4]
input_path = '~/.config/matugen/templates/noctalia-templates/gtk/gtk4.css'
output_path = '~/.config/gtk-4.0/noctalia.css'
post_hook = '~/.config/matugen/scripts/gtk-reload.py'

[theme.templates.user.qt6ct]
input_path = '~/.config/matugen/templates/colors-qt.conf'
output_path = '~/.config/qt6ct/colors/meterial.conf'
colors_to_compare = [
  { name = "Fluent-teal-dark", color = "#159a80" },
  { name = "Fluent-green-dark", color = "#a1bf80" },
  { name = "Fluent-yellow-dark", color = "#f3c863" },
  { name = "Fluent-orange-dark", color = "#eba96a" },
  { name = "Fluent-red-dark", color = "#e27c7c" },
  { name = "Fluent-pink-dark", color = "#ec87a9" },
  { name = "Fluent-purple-dark", color = "#9b7fcb" },
  { name = "Fluent-dark", color = "#5294e2" }
]
compare_to = "{{colors.primary.default.hex}}"
post_hook="gsettings set org.gnome.desktop.interface icon-theme '{{closest_color}}' && sed -i 's/^Theme=.*/Theme={{closest_color}}/' ~/.config/kdeglobals"


[theme.templates.user.kvantum]
input_path = '~/.config/matugen/templates/kvantum/colors-kvantum.kvconfig'
output_path = '~/.config/Kvantum/meterial/meterial.kvconfig'

[theme.templates.user.kvantum-svg]
input_path = "~/.config/matugen/templates/kvantum/colors-kvantum.svg"
output_path = "~/.config/Kvantum/meterial/meterial.svg"

[theme.templates.user.niri]
input_path = '~/.config/matugen/templates/colors-niri.kdl'
output_path = '~/.config/niri/modules/theme.kdl'

[theme.templates.user.hyprland]
input_path = '~/.config/matugen/templates/colors-hyprland.conf'
output_path = '~/.config/hypr/modules/material.conf'

[theme.templates.user.telegram]
input_path = "~/.config/matugen/templates/colors-telegram.tdesktop-theme"
output_path = "~/.config/telegram-desktop/themes/colors.tdesktop-theme"
post_hook = '~/.config/matugen/scripts/telegram-reload.sh "{{colors.surface.default.hex}}"'

[theme.templates.user.vesktop]
input_path = "~/.config/matugen/templates/colors-discord.css"
output_path = "~/.config/vesktop/themes/meterial.css"

[theme.templates.user.cava]
input_path = '~/.config/matugen/templates/colors-cava'
output_path = '~/.config/cava/config'
post_hook = 'pkill -USR2 cava'

[theme.templates.user.spicetify]
input_path = '~/.config/matugen/templates/colors-spotify.ini'
output_path = '~/.config/spicetify/Themes/Comfy/color.ini'
post_hook = '~/.config/matugen/scripts/spotify-reload.sh &'

[theme.templates.user.zenChrome]
input_path = '~/.config/matugen/templates/zen/colors-zenChrome.css'
output_path = '~/.zen/default/chrome/userChrome.css'

[theme.templates.user.zenContent]
input_path = '~/.config/matugen/templates/zen/colors-zenContent.css'
output_path = '~/.zen/default/chrome/userContent.css'

[theme.templates.user.zenLogo]
input_path = '~/.config/matugen/templates/zen/colors-zenLogo.svg'
output_path = '~/.zen/default/chrome/zen-logo.svg'
post_hook = '~/.config/matugen/scripts/zen-reload.sh &'

[theme.templates.user.vscode]
input_path = '~/.config/matugen/templates/colors-vscode.json'
output_path = '~/.vscode/extensions/rakib13332.material-code-3.0.6/build/dark.json'

[theme.templates.user.fcitx5-panel]
input_path = '~/.config/matugen/templates/fcitx5/panel.svg'
output_path = '~/.local/share/fcitx5/themes/material/panel.svg'

[theme.templates.user.fcitx5-hilight]
input_path = '~/.config/matugen/templates/fcitx5/highlight.svg'
output_path = '~/.local/share/fcitx5/themes/material/highlight.svg'
post_hook = 'sh -c "pgrep -x fcitx5 >/dev/null && fcitx5 -rd || true"'

[theme.templates.user.burp]
input_path = "~/.config/matugen/templates/colors-burpsuite.json"
output_path = "~/.config/burp/material.json"

[theme.templates.user.obs]
input_path = "~/.config/matugen/templates/colors-obs.obt"
output_path = "~/.config/obs-studio/themes/matugen.obt"

[theme.templates.user.pywalfox]
input_path = "~/.config/matugen/templates/colors-pywalfox.json"
output_path = "~/.cache/wal/colors.json"
post_hook = "pywalfox update"
