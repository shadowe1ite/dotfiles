$mainMod = SUPER

bind = $mainMod, RETURN, exec, $terminal
bind = ALT SHIFT, W, exec, $terminal
bind = $mainMod, W, killactive, 
bind = $mainMod, U, exit, 
bind = $mainMod, S, togglefloating, 
bind = $mainMod, S, centerwindow,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, G, togglegroup
bind = $mainMod, A, togglespecialworkspace 
bind = $mainMod SHIFT, A, movetoworkspace, special
bind = ALT, F11, fullscreen, 1
bind = ALT, P, pin, 1

# Other
bind = Ctrl, Home, exec, bash -c 'grim -g "$(slurp)" /tmp/qrcode.png && zbarimg /tmp/qrcode.png -q --raw | tee >(wl-copy) | xargs -r notify-send -i "/usr/share/icons/.Fluent-dark-base/symbolic/actions/qrscanner-symbolic.svg" "QR Code copied"'
bindl = Ctrl, Print, exec, grim - | tee "$(xdg-user-dir PICTURES)/Screenshots/Screenshot_$(date '+%Y-%m-%d_%H.%M.%S').png" | wl-copy && sleep 0.2;notify-send -i gnome-screenshot "Screenshot Taken" "Your screenshot has been saved and copied to clipboard."
bindl = , Print, exec, grimblast --freeze copy area
bind = CTRL, Q, exec, hyprpicker --autocopy

bind = $mainMod, F, exec, $browser
bind = ALT, T, exec, telegram-desktop
bind = ALT, G, exec, rofi -modi games -show games -theme games-default

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

binde = $mainMod ALT, right, resizeactive, 10 0
binde = $mainMod ALT, left, resizeactive, -10 0
binde = $mainMod ALT, up, resizeactive, 0 -10
binde = $mainMod ALT, down, resizeactive, 0 10

binde= SUPER SHIFT ALT, left, moveactive,  -40 0
binde= SUPER SHIFT ALT, right, moveactive, 40 0
binde= SUPER SHIFT ALT, up, moveactive, 0 -40
binde= SUPER SHIFT ALT, down, moveactive, 0 40

bind = $mainMod ALT CTRL, left, movewindow, l
bind = $mainMod ALT CTRL, right, movewindow, r
bind = $mainMod CTRL ALT, up, movewindow, u
bind = $mainMod CTRL ALT, down, movewindow, d

# speakers
bindle = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
bindle = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle 

bindle = ALT,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%+ 
bindle = ALT,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%-
bindl = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle 

# music control
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPrev, exec, playerctl previous 
bindl = ,XF86AudioPlay, exec, playerctl play-pause

bindl = ,XF86ScreenSaver, exec, hyprctl dispatch dpms

# rgb
bindle = ,code:211, exec, asusctl aura -n
bindle = ,code:248, exec, asusctl aura -p

# process
bind = CTRL SHIFT, ESCAPE, exec, resources
