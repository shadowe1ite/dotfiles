# sptlrx + cava
workspace = special:sptlrx, on-created-empty:[float; size 70% 40%; move 15% 5%] alacritty -t sptlrx -e zsh -lc 'unset TMUX; tmux -u has-session -t music && tmux -u attach -t music || { tmux -u new-session -d -s music -n main "zsh -lc \"cava; exec zsh\""; tmux -u split-window -h -p 70 -t music:main "zsh -lc \"sptlrx; exec zsh\""; tmux -u attach -t music; }', persistent:false
