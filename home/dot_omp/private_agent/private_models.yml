providers:
  omniroute:
    baseUrl: http://amd:20128/v1
    api: openai-completions
    apiKey: OMNIROUTE_API_KEY
    auth: apiKey
    discovery:
      type: openai-models-list

  omniroute-judge:
    baseUrl: http://amd:20128
    api: typesafe
    apiKey: OMNIROUTE_API_KEY
    auth: apiKey
    models:
      - id: Clef
        name: AMD Clef
        contextWindow: 32768
      - id: d3
        name: AMD D3
        contextWindow: 32768
      - id: d3-flash
        name: AMD D3 Flash
        contextWindow: 32768

  amd-radeon:
    baseUrl: https://developer.amd.com.cn/radeon/api/v1
