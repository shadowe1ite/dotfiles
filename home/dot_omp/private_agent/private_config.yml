setupVersion: 3
symbolPreset: unicode
bash:
  patterns:
    - match: pass
      approval: deny
    - match: pass *
      approval: deny
composer:
  shape: claude
  tokenRate: true
theme:
  dark: dark-ember
  light: light
statusLine:
  preset: default
  transparent: false
  separator: powerline
  showHookStatus: true
  sessionAccent: true
browser:
  enabled: false
  headless: false
memory:
  backend: mnemopi
update:
  auto: true
modelRoles:
  default: cursor/grok-4.7
  smol: omniroute/zed-hosted/gpt-6-luna
  judge: amd-radeon-judge/d3
defaultThinkingLevel: auto
retry:
  maxRetries: 5
  fallbackChains:
    judge: []
task:
  autoParallel: suggest
find:
  enabled: "on"
ttsr:
  judge: "on"
prewalk:
  auto: "off"
hideThinkingBlock: true
extendedContext: false
mnemopi:
  embeddingApiUrl: https://integrate.api.nvidia.com/v1
  embeddingModel: nvidia/nemotron-3.5-embed-8b
  embeddingInputType: true