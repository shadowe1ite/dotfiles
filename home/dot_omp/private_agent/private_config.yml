setupVersion: 3
symbolPreset: nerd
bash:
  patterns:
    - match: pass
      approval: deny
    - match: pass *
      approval: deny
composer:
  shape: claude
  tokenRate: true
theme:
  dark: dark-ember
  light: light
statusLine:
  preset: default
  transparent: false
  separator: powerline
  showHookStatus: true
  sessionAccent: true
browser:
  enabled: false
  headless: false
memory:
  backend: mnemopi
update:
  auto: true
modelRoles:
  default: openai-codex/gpt-5.6-sol
  smol: omniroute/amd/DeepSeek-V4.1-Flash:auto
  judge: amd-radeon-judge/d3
defaultThinkingLevel: auto
retry:
  maxRetries: 5
  fallbackChains:
    judge: []
task:
  autoParallel: suggest
find:
  enabled: "on"
ttsr:
  judge: "on"
hideThinkingBlock: false
extendedContext: false
mnemopi:
  embeddingApiUrl: https://integrate.api.nvidia.com/v1
  embeddingModel: nvidia/nemotron-3-embed-1b
  embeddingInputType: true
  scoping: global
codexResets:
  autoRedeem5h: "no"