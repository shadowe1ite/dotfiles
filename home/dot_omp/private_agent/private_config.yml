setupVersion: 3
symbolPreset: unicode
bash:
  patterns:
    - match: pass
      approval: deny
    - match: pass *
      approval: deny
composer:
  shape: claude
  tokenRate: true
theme:
  dark: dark-ember
  light: light
statusLine:
  preset: default
  transparent: false
  separator: powerline
  showHookStatus: true
  sessionAccent: false
browser:
  enabled: true
memory:
  backend: "off"
update:
  auto: true
modelRoles:
  default: cursor/grok-4.7
  smol: omniroute/zed-hosted/gpt-6-luna
  judge: amd-radeon-judge/d3
defaultThinkingLevel: auto
retry:
  maxRetries: 5
  fallbackChains:
    judge: []
task:
  autoParallel: suggest
find:
  enabled: "on"
ttsr:
  judge: "on"
prewalk:
  auto: "off"
hideThinkingBlock: true