setupVersion: 3
symbolPreset: nerd
bash:
  patterns:
    - match: pass
      approval: deny
    - match: pass *
      approval: deny
composer:
  shape: claude
  tokenRate: true
theme:
  dark: dark-ember
  light: light
statusLine:
  preset: default
  transparent: false
  separator: powerline
  showHookStatus: true
  sessionAccent: true
browser:
  enabled: false
  headless: false
memory:
  backend: mnemopi
update:
  auto: true
modelRoles:
  default: openai-codex/gpt-daybreak-blue-latest:high
  smol: openai-codex/gpt-6-luna:xhigh
  judge: amd-radeon-judge/d3
defaultThinkingLevel: auto
retry:
  maxRetries: 5
  fallbackChains:
    judge: []
task:
  autoParallel: suggest
find:
  enabled: "on"
ttsr:
  judge: "on"
hideThinkingBlock: true
extendedContext: false
mnemopi:
  embeddingApiUrl: https://generativelanguage.googleapis.com/v1beta/openai/
  embeddingModel: gemini-embedding-001
  embeddingInputType: false
  scoping: global
codexResets:
  autoRedeem5h: "no"
dev:
  autoqaConsent: denied
